<!-- --------------------------------------------Perform Display Property----------------------------- -->



<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        span{
            color: red;
        }
        .box{
            /* display: inline; */
            display: inline-block;
            border: 4px solid black;
            margin: 30px;
            padding: 40px;
        }
        .box1{
            /* display: none; it its mean that our box will be disapear but space is also free */
            /* visibility: hidden; its mean that our box will be disapear but space will remain as it is */
        }
    </style>
</head>
<body>
    <div class="box box1" style="background-color: aquamarine;">This is a box</div>
    <div class="box" style="background-color: blue;">This is another box</div>
    <span>This is 1 span</span>
    <span>This is 2 span</span>
</body>
</html>
