<!-- <!DOCTYPE html>
<html>
<body>

<input type="number" id="num">

<button onclick="prime()">Check Prime</button>

<p id="result"></p>

<script>

function prime() {

    let num = document.getElementById("num").value;
    let count = 0;

    for(let i = 2; i <= num; i++) {

        if(num % i == 0) {
            count++;
        }

    }

    if(count == 2) {
        document.getElementById("result").innerHTML = "Prime Number";
    }
    else {
        document.getElementById("result").innerHTML = "Not Prime Number";
    }

}

</script>

</body>
</html> -->


<!-- <!DOCTYPE html>
<html>
<body>

<input type="text" id="text" placeholder="Enter a string">

<button onclick="reverseString()">Reverse</button>

<p id="result"></p>

<script>

function reverseString() {

    let str = document.getElementById("text").value;
    let rev = "";

    for(let i = str.length - 1; i >= 0; i--) {
        rev = rev + str[i];
    }

    document.getElementById("result").innerHTML = rev;
}

</script>
